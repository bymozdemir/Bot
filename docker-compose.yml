services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    stop_grace_period: 15s
    # Konteyner sertlestirme: yalniz /app/data yazilabilir, ayricalik yok, kaynak siniri var.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
